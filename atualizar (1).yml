# Roda o script de atualização sozinho, sem ninguém mexer.
# - "schedule" faz ele acordar a cada hora, 24h por dia.
# - "workflow_dispatch" deixa você também rodar manualmente
#   (aba "Actions" do seu repositório, botão "Run workflow").

name: Atualizar dados do jornal

on:
  schedule:
    - cron: "0 * * * *"   # todo santo dia, de hora em hora, no minuto 0
  workflow_dispatch: {}

jobs:
  atualizar:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # precisa pra poder fazer commit/push sozinho

    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependências (todas grátis)
        run: pip install requests feedparser

      - name: Buscar dados atualizados
        env:
          # Configure em: Settings > Secrets and variables > Actions
          # Chave grátis, criada em aistudio.google.com
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python atualizar_dados.py

      - name: Publicar a atualização (commit + push automático)
        run: |
          git config user.name "robo-do-jornal"
          git config user.email "actions@users.noreply.github.com"
          git add dados.json
          git diff --staged --quiet || git commit -m "Atualização automática de dados"
          git push
